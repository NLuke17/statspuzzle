<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>
  
  <!-- 3x3 Grid -->
  <!-- Row 1 -->
  <rect x="20" y="20" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <rect x="51" y="20" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <rect x="82" y="20" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  
  <!-- Row 2 -->
  <rect x="20" y="51" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <rect x="51" y="51" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <rect x="82" y="51" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  
  <!-- Row 3 -->
  <rect x="20" y="82" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <rect x="51" y="82" width="25" height="25" rx="3" fill="white" opacity="0.95"/>
  <!-- Empty space -->
  <rect x="82" y="82" width="25" height="25" rx="3" fill="white" opacity="0.3"/>
  
  <!-- Numbers -->
  <text x="32.5" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">1</text>
  <text x="63.5" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">2</text>
  <text x="94.5" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">3</text>
  
  <text x="32.5" y="71" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">4</text>
  <text x="63.5" y="71" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">5</text>
  <text x="94.5" y="71" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">6</text>
  
  <text x="32.5" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">7</text>
  <text x="63.5" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#667eea" text-anchor="middle">8</text>
</svg>

